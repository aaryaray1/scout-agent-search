[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-agent-search"
version = "0.1.0"
description = "A search engine that returns pre-structured JSON evidence, so agents never have to parse HTML themselves."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "sentence-transformers",
    "pydantic",
    "numpy",
    "httpx",
    "trafilatura",
]

[project.optional-dependencies]
# The MCP server is an extra so the HTTP service doesn't carry the SDK.
# Pinned to 2.x: 1.x exposes FastMCP where 2.x exposes MCPServer.
mcp = ["mcp>=2,<3"]
dev = ["pytest", "httpx", "radon", "mcp>=2,<3"]

[project.scripts]
scout-ingest = "scout.cli:main"
scout-mcp = "scout.mcp:main"

[tool.setuptools.packages.find]
include = ["scout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::ResourceWarning"]
